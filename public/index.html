<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>If Historical Flags Had Sound</title>
<style>
  html, body { margin: 0; height: 100%; background: #000; color: #ddd; font-family: system-ui, sans-serif; }
  #wrap { height: 100%; display: flex; align-items: center; justify-content: center; }
  canvas { height: 100vh; max-width: 100vw; aspect-ratio: 9 / 16; background: #000; }
  body.render { overflow: hidden; }
  body.render #wrap { display: block; height: auto; }
  body.render canvas { width: 720px; height: 1280px; max-width: none; display: block; }
  #ui { position: fixed; left: 0; right: 0; bottom: 14px; text-align: center; font-size: 14px; pointer-events: none; }
  #ui > * { pointer-events: auto; }
  button { background: #ffd54a; color: #111; border: 0; padding: 10px 18px; border-radius: 8px; font-size: 15px; font-weight: 600; cursor: pointer; margin: 0 4px; }
  button:disabled { opacity: .5; cursor: default; }
  #info { display: block; margin-top: 8px; color: #999; }
</style>
</head>
<body>
<div id="wrap"><canvas id="c" width="720" height="1280"></canvas></div>
<div id="ui">
  <button id="play">&#9654; Play + suara</button>
  <button id="wav" disabled>Unduh WAV</button>
  <span id="info">Klik Play (browser butuh interaksi untuk memutar audio).</span>
</div>

<script src="../src/config.js"></script>
<script src="../src/geometry.js"></script>
<script src="../src/timeline.js"></script>
<script src="../src/flags.js"></script>
<script src="../src/audio.js"></script>
<script src="../src/renderer.js"></script>
<script>
(function () {
  const FS = window.FS, C = FS.config;
  const params = new URLSearchParams(location.search);
  const RENDER = params.has('render');
  if (params.get('footer')) C.FOOTER = params.get('footer');

  const canvas = document.getElementById('c'), ctx = canvas.getContext('2d');
  const r = FS.createRenderer(ctx, (w, h) => { const c = document.createElement('canvas'); c.width = w; c.height = h; return c; });
  const total = r.flags.total + 1.2;
  window.__drawFrame = t => r.draw(t);
  window.__total = total;
  r.draw(0);

  if (RENDER) {                       // mode render (Puppeteer): tanpa UI
    document.body.classList.add('render');
    document.getElementById('ui').style.display = 'none';
    window.__ready = true;
    return;
  }

  // ---------------- mode preview ----------------
  const $play = document.getElementById('play'), $wav = document.getElementById('wav'), $info = document.getElementById('info');
  let audio = null, ac = null, src = null, t0 = 0, playing = false;

  function loop() {
    if (!playing) return;
    const t = ac.currentTime - t0;
    r.draw(Math.min(t, total));
    $info.textContent = t.toFixed(2) + ' / ' + total.toFixed(2) + ' dtk';
    if (t >= total) { playing = false; $play.innerHTML = '&#9654; Play + suara'; return; }
    requestAnimationFrame(loop);
  }
  $play.onclick = async () => {
    if (playing) { src.stop(); playing = false; $play.innerHTML = '&#9654; Play + suara'; return; }
    $play.disabled = true; $info.textContent = 'Menyiapkan audio...';
    await new Promise(res => setTimeout(res, 30));
    if (!audio) audio = FS.renderAudio();
    ac = ac || new (window.AudioContext || window.webkitAudioContext)();
    const buf = ac.createBuffer(2, audio.L.length, audio.sr);
    buf.copyToChannel(audio.L, 0); buf.copyToChannel(audio.R, 1);
    src = ac.createBufferSource(); src.buffer = buf; src.connect(ac.destination);
    t0 = ac.currentTime + 0.05; src.start(t0);
    playing = true; $play.disabled = false; $play.innerHTML = '&#9632; Stop'; $wav.disabled = false;
    requestAnimationFrame(loop);
  };
  $wav.onclick = () => {
    const bytes = FS.encodeWav(audio.L, audio.R, audio.sr);
    const a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob([bytes], { type: 'audio/wav' })); a.download = 'flag-sound.wav'; a.click();
  };
})();
</script>
</body>
</html>
